<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonPay Pro - Transaction History</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #ffffff; padding: 20px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        
        .history-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #334155; }
        .transaction-item:last-child { border-bottom: none; }
        
        .tx-details { display: flex; flex-direction: column; gap: 4px; }
        .tx-title { font-weight: bold; font-size: 15px; }
        .tx-date { font-size: 12px; color: #94a3b8; }
        
        .tx-amount { font-weight: bold; font-size: 16px; }
        .credit { color: #10b981; }
        .debit { color: #ef4444; }
        .status { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #334155; color: #cbd5e1; display: inline-block; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="dashboard.html" class="back-btn">← Back</a>
        <h2>Transaction History</h2>
        <div></div>
    </div>

    <div class="history-card">
        
        <!-- Sample Transaction 1 -->
        <div class="transaction-item">
            <div class="tx-details">
                <span class="tx-title">Deposit</span>
                <span class="tx-date">27 Jul 2026, 08:30 PM</span>
                <span class="status" style="background: rgba(16, 185, 129, 0.2); color: #10b981;">Success</span>
            </div>
            <div class="tx-amount credit">+₹500</div>
        </div>

        <!-- Sample Transaction 2 -->
        <div class="transaction-item">
            <div class="tx-details">
                <span class="tx-title">Withdrawal</span>
                <span class="tx-date">26 Jul 2026, 02:15 PM</span>
                <span class="status" style="background: rgba(16, 185, 129, 0.2); color: #10b981;">Success</span>
            </div>
            <div class="tx-amount debit">-₹200</div>
        </div>

        <!-- Sample Transaction 3 -->
        <div class="transaction-item">
            <div class="tx-details">
                <span class="tx-title">Commission Credit (7%)</span>
                <span class="tx-date">25 Jul 2026, 11:00 AM</span>
                <span class="status" style="background: rgba(16, 185, 129, 0.2); color: #10b981;">Success</span>
            </div>
            <div class="tx-amount credit">+₹35</div>
        </div>

    </div>

</body>
</html>
