<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonPay Pro - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; padding: 15px; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2, h3 { color: #2c3e50; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #007bff; color: white; }
        input[type="number"] { width: 80px; padding: 5px; text-align: center; }
        button { background: #28a745; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🐉 DragonPay Pro Admin Panel</h2>
        <p>Total Registered Users: <b id="userCount">0</b></p>
    </div>

    <div class="card">
        <h3>User Balance Manage Karein</h3>
        <table>
            <thead>
                <tr>
                    <th>User ID / Phone</th>
                    <th>Current Balance (₹)</th>
                    <th>New Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <!-- Data Javascript se aayega -->
            </tbody>
        </table>
    </div>

    <script>
        // Password Check
        let pass = prompt("Admin Password Daalein:");
        if (pass !== "honey999@ai") {
            alert("Galat Password!");
            document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>Access Denied!</h2>";
        } else {
            loadUsers();
        }

        function loadUsers() {
            // Check default users or existing users
            let users = JSON.parse(localStorage.getItem('dragonpay_users')) || [
                { id: "9876543210", balance: 100 },
                { id: "User_Demo", balance: 0 }
            ];

            // Save initial data if empty
            if (!localStorage.getItem('dragonpay_users')) {
                localStorage.setItem('dragonpay_users', JSON.stringify(users));
            }

            document.getElementById('userCount').innerText = users.length;
            let tbody = document.getElementById('userTable');
            tbody.innerHTML = "";

            users.forEach((u, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${u.id}</b></td>
                        <td style="color:green; font-weight:bold;">₹${u.balance.toFixed(2)}</td>
                        <td><input type="number" id="bal_${index}" value="${u.balance}"></td>
                        <td><button onclick="updateBalance(${index})">Update Balance</button></td>
                    </tr>
                `;
            });
        }

        function updateBalance(index) {
            let users = JSON.parse(localStorage.getItem('dragonpay_users'));
            let newBal = document.getElementById(`bal_${index}`).value;
            
            users[index].balance = parseFloat(newBal) || 0;
            localStorage.setItem('dragonpay_users', JSON.stringify(users));
            
            alert("Balance successfully update ho gaya hai!");
            loadUsers();
        }
    </script>
</body>
</html>
