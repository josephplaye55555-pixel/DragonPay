<!-- Balance Display Box -->
<div style="background:#007bff; color:white; padding:15px; border-radius:8px; text-align:center; font-size:20px; font-weight:bold;">
    Wallet Balance: <span id="appWalletBalance">₹0.00</span>
</div>

<script>
    // App Mein Balance Show Karne Ka Script
    function fetchWalletBalance() {
        let users = JSON.parse(localStorage.getItem('dragonpay_users')) || [];
        
        // Pehle user ka balance dikhane ke liye (Aap apne according User ID replace kar sakte hain)
        if(users.length > 0) {
            document.getElementById('appWalletBalance').innerText = "₹" + users[0].balance.toFixed(2);
        } else {
            document.getElementById('appWalletBalance').innerText = "₹0.00";
        }
    }

    // Page load hote hi balance update hoga
    window.onload = fetchWalletBalance;
</script>
