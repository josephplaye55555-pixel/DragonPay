<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonPay Pro - Deposit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #ffffff; padding: 20px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 20px; }
        
        /* QR Code Section */
        .qr-section { text-align: center; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        .qr-box { background: white; padding: 10px; display: inline-block; border-radius: 12px; margin: 10px 0; }
        .qr-box img { width: 220px; height: auto; display: block; border-radius: 8px; }
        
        .upi-copy-box { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
        .upi-id { font-weight: bold; color: #38bdf8; letter-spacing: 0.5px; }
        .copy-btn { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #ffffff; font-size: 16px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }

        .submit-btn { width: 100%; background: #10b981; color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <a href="dashboard.html" class="back-btn">← Back</a>
        <h2>Deposit Funds</h2>
        <div></div>
    </div>

    <!-- QR Code & Payment Section -->
    <div class="card">
        <div class="qr-section">
            <p style="font-size: 14px; color: #94a3b8;">Scan & Pay using any UPI App</p>
            
            <div class="qr-box">
                <!-- Aapki Photo Waala QR Code -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=dragonpay.pro@axl%26pn=DragonPayPro" alt="UPI QR Code">

            </div>

            <div class="upi-copy-box">
                <span class="upi-id" id="upiText">dragonpay.pro@axl</span>
                <button class="copy-btn" onclick="copyUPI()">Copy UPI</button>
            </div>
        </div>

        <!-- Deposit Form -->
        <form id="depositForm">
            <div class="form-group">
                <label>Select Fund Type</label>
                <select required>
                    <option value="gaming">🎮 Gaming Fund (7%)</option>
                    <option value="mixed">🎲 Mixed Fund (9%)</option>
                    <option value="stock">📈 Stock Fund (11%)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Deposit Amount (₹)</label>
                <input type="number" placeholder="Enter amount e.g. 500" min="100" required>
            </div>

            <div class="form-group">
                <label>Transaction / UTR ID (12 Digits)</label>
                <input type="text" placeholder="Enter 12-digit UTR Number" required maxlength="12">
            </div>

            <button type="submit" class="submit-btn">Submit Deposit Request</button>
        </form>
    </div>

    <script>
        const myUpiId = "dragonpay.pro@axl";

        function copyUPI() {
            navigator.clipboard.writeText(myUpiId);
            alert("UPI ID copied: " + myUpiId);
        }

        document.getElementById('depositForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Deposit Request Submitted Successfully!');
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
